apiVersion: gitops.noctf.dev/v2
kind: ChallengeTemplate
id: 10000000-0000-0000-0000-000000000101
mode: Ctf
title: CTF Container Example
direction: Examples
visibility: Private
statement: statement.md
attachments: []
flags: []
build:
  images:
    - key: runtime
      context: runtime
      dockerfile: runtime/Dockerfile
      platforms: [linux/amd64]
definition:
  mode: Ctf
  ctf:
    interactionKind: FlagSubmission
  runtime:
    kind: Container
    allocation: PerTeam
    flagSource: PerTeam
    egressPolicy: Isolated
    limits:
      memoryBytes: 268435456
      nanoCpus: 500000000
      pidsLimit: 128
    urlBindings:
      - urlTemplate: http://{HOST}:{PORT}/
        exposure: OwnerOnly
        containerPort: 8080
        isControlCheck: false
    container:
      image:
        build: runtime
      command: []
      environment: {}
      labels: {}
      portMappings:
        - containerPort: 8080
          hostPort: 0
      security:
        noNewPrivileges: false
        readonlyRootfs: false
        runAsNonRoot: false
        capDrop: []
        capAdd: []
      flagEnvironmentVariableName: FLAG
      internalPorts: []
