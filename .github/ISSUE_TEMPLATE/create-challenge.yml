name: Create challenge
description: Scaffold a reviewed challenge branch and draft pull request.
title: "[Challenge] "
labels:
  - challenge:create
body:
  - type: input
    id: title
    attributes:
      label: Title
    validations:
      required: true
  - type: input
    id: direction
    attributes:
      label: Direction
      description: For example Web, Pwn, Crypto, Reverse, or Misc.
    validations:
      required: true
  - type: input
    id: slug
    attributes:
      label: Slug
      description: Lowercase ASCII letters, digits, and single hyphens only.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Game Mode
      options: [Ctf, Awd, Awdp, Koh]
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime Type
      options: [Static (no runtime), Container, Compose]
    validations:
      required: true
  - type: input
    id: score
    attributes:
      label: Base Score
      value: "100"
    validations:
      required: true
  - type: input
    id: order
    attributes:
      label: Order
      value: "10"
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      description: GitHub handle of the primary author.
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
