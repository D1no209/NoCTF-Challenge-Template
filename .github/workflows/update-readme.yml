name: Update README

on:
  push:
    branches: [main]
    paths:
      - competition.yml
      - "*/*/challenge.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: 10.0.x
      - name: Generate README
        run: dotnet run --file .github/scripts/repository.cs -- readme
      - name: Commit README
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already current."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m "docs: update challenge index [skip ci]"
          git push
