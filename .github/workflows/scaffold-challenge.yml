name: Scaffold challenge

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: challenge-scaffold-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  scaffold:
    if: contains(github.event.issue.labels.*.name, 'challenge:create')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: 10.0.x
      - name: Configure Git identity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Scaffold branch and draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          dotnet run --file .github/scripts/repository.cs --
          scaffold --event "$GITHUB_EVENT_PATH"
