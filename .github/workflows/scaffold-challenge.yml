name: Scaffold challenge

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing challenge Issue number to retry
        type: number
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: challenge-scaffold-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  scaffold:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[Challenge]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: 10.0.x
      - name: Configure Git identity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Scaffold branch and draft pull request
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          dotnet run --file .github/scripts/repository.cs --
          scaffold --event "$GITHUB_EVENT_PATH"
      - name: Retry scaffold by Issue number
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          dotnet run --file .github/scripts/repository.cs --
          scaffold --issue '${{ inputs.issue_number }}'
