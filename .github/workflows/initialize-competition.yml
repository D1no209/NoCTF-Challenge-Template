name: Initialize competition

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing initialization Issue number to retry
        type: number
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: competition-initialize
  cancel-in-progress: false

jobs:
  initialize:
    if: >-
      (github.event_name == 'issues'
        && startsWith(github.event.issue.title, '[Initialize]'))
      || (github.event_name == 'issue_comment'
        && startsWith(github.event.issue.title, '[Initialize]')
        && github.event.comment.body == '/retry')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: 10.0.x
      - name: Configure Git identity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Initialize from Issue event
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          NOCTF_API_URL: ${{ vars.NOCTF_API_URL }}
          NOCTF_BOT_TOKEN: ${{ secrets.NOCTF_BOT_TOKEN }}
        run: >-
          dotnet run --file .github/scripts/repository.cs --
          initialize --event "$GITHUB_EVENT_PATH"
      - name: Retry initialization by Issue number
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          NOCTF_API_URL: ${{ vars.NOCTF_API_URL }}
          NOCTF_BOT_TOKEN: ${{ secrets.NOCTF_BOT_TOKEN }}
        run: >-
          dotnet run --file .github/scripts/repository.cs --
          initialize --issue '${{ inputs.issue_number }}'
